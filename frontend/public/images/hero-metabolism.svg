<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="hero-art-title">
  <title id="hero-art-title">人体轮廓、比例环与代谢通路科技图形</title>
  <defs>
    <linearGradient id="body-fill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e9fbff" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#bcefff" stop-opacity=".055"/>
      <stop offset="1" stop-color="#7edcf5" stop-opacity=".018"/>
    </linearGradient>
    <linearGradient id="body-line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d8f8ff" stop-opacity=".2"/>
      <stop offset=".48" stop-color="#f0fdff" stop-opacity=".58"/>
      <stop offset="1" stop-color="#90e5fb" stop-opacity=".13"/>
    </linearGradient>
    <linearGradient id="route-line" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d4f9ff" stop-opacity=".72"/>
      <stop offset=".55" stop-color="#aeeede" stop-opacity=".66"/>
      <stop offset="1" stop-color="#efd98b" stop-opacity=".72"/>
    </linearGradient>
    <radialGradient id="node-glow">
      <stop stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".22" stop-color="#cdf8ff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#79dbfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="micro-dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#d5f8ff" opacity=".28"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

