    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#7c929d"/></marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#39a56d"/></marker>
    <style>.node{fill:#f8fbfc;stroke:#7fa1b2;stroke-width:1.2}.key{fill:#e5f7ec;stroke:#39a56d;stroke-width:2}.cofactor{fill:#f4f0fb;stroke:#a08bc2}.label{font:13px Arial,sans-serif;fill:#314c5b;text-anchor:middle}.small{font:10px Arial,sans-serif;fill:#70828b;text-anchor:middle}.edge{fill:none;stroke:#7c929d;stroke-width:1.4;marker-end:url(#arrow)}.green{fill:none;stroke:#39a56d;stroke-width:2.4;marker-end:url(#green-arrow)}</style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/><text x="600" y="35" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#245d7e">Human Tryptophan Metabolism</text>
