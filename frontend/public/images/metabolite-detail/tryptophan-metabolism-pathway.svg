  <g><rect class="key" x="505" y="72" width="190" height="40" rx="3"/><text class="label" x="600" y="97">L-Tryptophan</text></g><g><rect class="key" x="520" y="176" width="160" height="68" rx="3"/><text class="label" x="600" y="205">Tryptophan</text><text class="small" x="600" y="224">IPTM00001 · C11H12N2O2</text></g>
  <g><rect class="node" x="195" y="176" width="170" height="68" rx="3"/><text class="label" x="280" y="205">5-Hydroxytryptophan</text><text class="small" x="280" y="224">TPH1 / TPH2</text></g><g><rect class="key" x="205" y="304" width="150" height="34" rx="3"/><text class="label" x="280" y="326">Serotonin</text></g><g><rect class="key" x="205" y="399" width="150" height="34" rx="3"/><text class="label" x="280" y="421">N-Acetylserotonin</text></g><g><rect class="key" x="205" y="494" width="150" height="34" rx="3"/><text class="label" x="280" y="516">Melatonin</text></g>
  <g><rect class="node" x="835" y="176" width="170" height="68" rx="3"/><text class="label" x="920" y="205">N-Formylkynurenine</text><text class="small" x="920" y="224">IDO1 / TDO2</text></g><g><rect class="key" x="845" y="304" width="150" height="34" rx="3"/><text class="label" x="920" y="326">Kynurenine</text></g><g><rect class="key" x="845" y="399" width="150" height="34" rx="3"/><text class="label" x="920" y="421">3-Hydroxykynurenine</text></g><g><rect class="node" x="845" y="494" width="150" height="34" rx="3"/><text class="label" x="920" y="516">Quinolinic acid</text></g>
  <g><rect class="node" x="380" y="400" width="150" height="34" rx="3"/><text class="label" x="455" y="422">Indole-3-pyruvate</text></g><g><rect class="node" x="380" y="495" width="150" height="34" rx="3"/><text class="label" x="455" y="517">Indole-3-acetate</text></g><g><rect class="node" x="670" y="400" width="150" height="34" rx="3"/><text class="label" x="745" y="422">Kynurenic acid</text></g><g><rect class="node" x="670" y="495" width="150" height="34" rx="3"/><text class="label" x="745" y="517">Xanthurenic acid</text></g><g><rect class="node" x="535" y="545" width="130" height="34" rx="3"/><text class="label" x="600" y="567">NAD+ synthesis</text></g>
